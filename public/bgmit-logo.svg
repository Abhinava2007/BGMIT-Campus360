<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Trim -->
  <circle cx="120" cy="120" r="114" fill="#0F2B5C" stroke="url(#goldGrad)" stroke-width="6"/>
  <circle cx="120" cy="120" r="106" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Upper Arc Inscription -->
  <path id="topArc" d="M 28 120 A 92 92 0 0 1 212 120" fill="none"/>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#FCD34D" letter-spacing="2.5" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">B.V.V. SANGHA • ESTD 1906</textPath>
  </text>

  <!-- Inner Center Circle -->
  <circle cx="120" cy="120" r="76" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Engineering Gear Behind Emblem -->
  <g transform="translate(120, 115) scale(0.7)" opacity="0.25">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FCD34D" stroke-width="10"/>
    <path d="M-6 -60 H6 V-48 H-6 Z M-6 48 H6 V60 H-6 Z M-60 -6 H-48 V6 H-60 Z M48 -6 H60 V6 H48 Z
             M-42 -42 L-34 -34 L-42 -26 L-50 -34 Z M34 34 L42 42 L34 50 L26 42 Z
             M42 -42 L34 -34 L42 -26 L50 -34 Z M-34 34 L-42 42 L-34 50 L-26 42 Z" fill="#FCD34D"/>
  </g>

  <!-- Flaming Torch of Wisdom (Center Top) -->
  <g transform="translate(120, 92)" filter="url(#shadow)">
    <!-- Flame -->
    <path d="M0 -22 C-5 -12 -10 -4 -6 6 C-4 10 0 14 0 14 C0 14 4 10 6 6 C10 -4 5 -12 0 -22 Z" fill="#EF4444"/>
    <path d="M0 -15 C-2 -9 -5 -3 -3 4 C-2 7 0 9 0 9 C0 9 2 7 3 4 C5 -3 2 -9 0 -15 Z" fill="#FBBF24"/>
    <!-- Torch Bowl -->
    <path d="M-10 14 L10 14 L7 22 L-7 22 Z" fill="url(#goldGrad)"/>
    <!-- Torch Handle -->
    <path d="M-3.5 22 L3.5 22 L2 36 L-2 36 Z" fill="#D97706"/>
  </g>

  <!-- Open Book of Learning (Center Bottom) -->
  <g transform="translate(120, 134)" filter="url(#shadow)">
    <!-- Book Pages -->
    <path d="M0 4 C-14 -4 -30 -2 -42 4 L-42 22 C-30 16 -14 14 0 20 C14 14 30 16 42 22 L42 4 C30 -2 14 -4 0 4 Z" fill="#FFFFFF"/>
    <!-- Center Spine & Dividing Lines -->
    <path d="M0 4 L0 20" stroke="#0F2B5C" stroke-width="2"/>
    <path d="M-36 8 C-26 4 -12 4 -4 8 M-36 12 C-26 8 -12 8 -4 12 M-36 16 C-26 12 -12 12 -4 16" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M36 8 C26 4 12 4 4 8 M36 12 C26 8 12 8 4 12 M36 16 C26 12 12 12 4 16" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Star of Excellence -->
    <polygon points="0,-4 2,1 7,1 3,4 5,9 0,6 -5,9 -3,4 -7,1 -2,1" fill="#F59E0B"/>
  </g>

  <!-- Lower Ribbon for College Name -->
  <g transform="translate(120, 196)">
    <!-- Ribbon Banner Background -->
    <path d="M-88 -4 L-76 -14 L-60 -10 L60 -10 L76 -14 L88 -4 L72 10 L-72 10 Z" fill="#B91C1C" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="0" y="3" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" letter-spacing="1.5" text-anchor="middle">
      BGMIT • MUDHOL
    </text>
  </g>

  <!-- Sub-ribbon with Technical Institute label -->
  <path id="bottomArc" d="M 210 128 A 94 94 0 0 1 30 128" fill="none"/>
  <text font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#CBD5E1" letter-spacing="1.5" text-anchor="middle">
    <textPath href="#bottomArc" startOffset="50%">VTU AFFILIATED • AICTE APPROVED</textPath>
  </text>
</svg>
